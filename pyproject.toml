[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-sessions"
version = "0.1.0"
description = "Universal cross-agent session management & history hub for coding agents (AGY, OpenCode, Pi, Cline, Codex, Copilot, CMD, CBC, Qwen, Grok, Adal)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "iredox", email = "idreesadam200@gmail.com" }
]
keywords = [
    "ai",
    "coding-agent",
    "agent",
    "session-management",
    "opencode",
    "cline",
    "antigravity",
    "pi-agent",
    "codex",
    "copilot",
    "developer-tools"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0"
]

[project.scripts]
asess = "asess.cli:main"
agent-sessions = "asess.cli:main"

[project.urls]
Homepage = "https://github.com/iredox10/agent-sessions"
Repository = "https://github.com/iredox10/agent-sessions"
Issues = "https://github.com/iredox10/agent-sessions/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["asess*"]
